name: CRA Clock
description: EU CRA Article 14 reporting clock. SBOM, CISA KEV exploited-vuln detection, 24h/72h deadlines, draft texts for ENISA.
author: Gautam Khosla
branding:
  icon: clock
  color: red
inputs:
  github-token:
    description: Token used to open and update CRA Clock issues (needs issues:write). Defaults to the workflow token.
    default: ${{ github.token }}
  product-name:
    description: Product name used in reports and ENISA drafts. Defaults to the repository name.
    default: ''
  product-version:
    description: Product version recorded in the SBOM. Defaults to the ref name.
    default: ''
  open-issues:
    description: "true or false. Open one issue per actively exploited vulnerability with the live Article 14 clock. Use false on pull_request events (fork PRs get a read-only token)."
    default: 'true'
  fail-on:
    description: "exploited (default), likely (exploited or EPSS at or above the threshold), or never. Any other value is an error."
    default: exploited
  epss-threshold:
    description: EPSS probability from 0 to 1 at or above which a vulnerability counts as likely to be exploited. 0 marks every advisory with an EPSS score as likely.
    default: '0.1'
  allow-incomplete-intel:
    description: "true or false. If OSV details or EPSS cannot be fetched, affected advisories are listed for manual review and the job fails, unless this is true."
    default: 'false'
  output-dir:
    description: Where sbom.cdx.json, vex.cdx.json and report.md are written.
    default: cra-clock
outputs:
  components: { description: Number of components found }
  exploited: { description: Number of actively exploited vulnerabilities (CISA KEV) }
  likely: { description: Number of vulnerabilities above the EPSS threshold }
  intel-incomplete: { description: Number of advisories that could not be fully checked and need manual review }
  sbom: { description: Path to the CycloneDX 1.6 SBOM }
  vex: { description: Path to the CycloneDX 1.6 VEX }
runs:
  using: node24
  main: src/main.mjs
